name: CI

on:
  pull_request:
    paths:
      - "src/**"
      - "nix/**"
      - "flake.*"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "nix/**"
      - "flake.*"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gtk-build:
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    name: Build package ${{ matrix.system }}

    steps:
      - uses: actions/checkout@v6

      # zig2nix uses bubblewrap, which needs unprivileged user namespaces.
      - name: Allow bubblewrap user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21

      - name: Cache Nix builds
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false

      - name: Build package
        run: nix build --print-build-logs .#packages.${{ matrix.system }}.machtoo
